  - results/comparison/head_to_head_msintuit.csv updated (full cohort, OAUTHC included)
  - docs/experiments/A6-oauthc-synthesis.md
  - id: D1-error-structure
    priority: 84
    status: todo
    deps:
    - A0-harmony-scorer
    gpu: false
    summary: 'Error-structure + COMPLEMENTARITY analysis across all scorers (champion, S4 tile-MIL, A0 harmony, A1 batch-corrected, + A2 stain-norm when it lands). Build patient x scorer score matrix. KEY
      TEST: on the champion''s WRONG patients (esp. OAUTHC), does ANY other scorer get those SAME cases right? Report: per-scorer per-site AUROC matrix; pairwise error-overlap / complementarity (Q-statistic
      or disagreement rate on errors); oracle-selection ceiling (AUROC if each patient routed to its best scorer); error correlates (n_slides, tumor_fraction, artifact_fraction, site). VERDICT: is a case-conditioned
