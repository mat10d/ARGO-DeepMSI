# HistoBistro Model Configuration for MSI Prediction
# This config is used for testing the pre-trained MSI model on ARGO-DeepMSI data

# Logging options
save_dir: results/stage5_baseline
project: ARGO_HistoBistro_Baseline
name: msi_baseline_test

# Task definition
data_config: configs/histobistro/data_config.yaml
task: binary
target: isMSIH
num_classes: 1
cohorts: ["ARGO"]
ext_cohorts: ["ARGO"]
clini_info: {}
seed: 42

# Label mapping - map our labels to 0/1
label_dict:
  MSS: 0
  MSI-H: 1

# Model options (must match pre-trained model architecture)
model: Transformer
model_config:
  heads: 8
  dim_head: 64
  dim: 512
  mlp_dim: 512
norm: raw  # Use raw features (no normalization)
feats: ctranspath  # CTransPath features (768-dim)
input_dim: 768
num_tiles: -1  # Use all tiles
pad_tiles: false

# Training options (not used for testing, but required by config schema)
folds: 5
num_epochs: 8
criterion: BCEWithLogitsLoss
optimizer: AdamW
lr_scheduler: null
lr: 2.0e-05
wd: 2.0e-05
bs: 1
stop_criterion: loss
val_check_interval: 1000
num_samples: null
