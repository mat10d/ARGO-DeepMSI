# HistoBistro Data Configuration
# Points to ARGO-DeepMSI data prepared by Stage 4 (feature validation)

ARGO:
  # Clinical table (PATIENT, isMSIH columns) - from Stage 4
  clini_table: results/stage4_feature_validation/ctranspath/tables/all_clinical_table.csv

  # Slide table (PATIENT, FILENAME columns) - auto-generated by Stage 4 for ctranspath
  # FILENAME column contains stems only (no .h5), matching HistoBistro's glob-based matching
  slide_csv: results/stage4_feature_validation/ctranspath/tables/all_slide_table_histobistro.csv

  # Feature directory - HistoBistro will recursively search for h5 files using glob('**/*.h5')
  # Points to ctranspath features root, contains subdirectories per site
  feature_dir:
    raw:
      ctranspath: results/stage3_features/ctranspath/

  # Folds directory (will be created if needed by HistoBistro)
  folds: results/stage5_baseline/folds/
