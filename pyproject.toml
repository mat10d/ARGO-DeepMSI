[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argo-deepmsi"
version = "0.2.0"
description = "MSI prediction from whole slide images using LazySlide"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ARGO-DeepMSI Team"},
]
keywords = ["pathology", "deep-learning", "MSI", "whole-slide-imaging", "computational-pathology", "lazyslide"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "lazyslide>=0.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",

    # Fix for lazyslide dependency issues with Python 3.11
    "llvmlite>=0.46.0",
    "numba>=0.59.0",

    # Data ingestion
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # ML/Training
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",

    # Utilities
    "tqdm>=4.65.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.1.0",
]

[project.scripts]
argo = "argo_deepmsi.cli:app"

[project.urls]
Homepage = "https://github.com/mat10d/ARGO-DeepMSI"
Repository = "https://github.com/mat10d/ARGO-DeepMSI"

[tool.setuptools]
packages = ["argo_deepmsi"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py311"
