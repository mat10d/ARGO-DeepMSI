[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argo-deepmsi"
version = "0.2.0"
description = "MSI prediction from whole slide images using LazySlide"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [
    {name = "ARGO-DeepMSI Team"},
]
keywords = ["pathology", "deep-learning", "MSI", "whole-slide-imaging", "computational-pathology", "lazyslide"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core (LazySlide stack lives in envs/lazyslide; see docs/backends-plan.md)
    "pandas>=2.0.0,<3.0.0",  # <3.0 to avoid ArrowStringArray serialization issues
    "numpy>=1.24.0",
    "packaging>=23.0",

    # Data ingestion
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0,<4.0.0",  # PathPresenter Excel workbook exports
    "xlrd>=2.0.0,<3.0.0",  # Legacy .xls PathPresenter exports

    # Slide tasks + backend feature readers
    "openslide-python>=1.3.0",
    "openslide-bin>=4.0.0",
    "h5py>=3.10.0",  # Mussel .h5 features/coords
    "pyarrow>=14.0.0",  # LazySlide zarr shapes.parquet
    "shapely>=2.0.0",  # WKB tile polygons

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "umap-learn>=0.5.0",  # slide-embedding UMAP

    # Scverse data layer (reads LazySlide 0.12 zarr v3 tables)
    "anndata>=0.11.0",
    "zarr>=3.0.0",

    # ML/Training
    "scikit-learn>=1.3.0",
    "inmoose>=0.9.0",  # pycombat ComBat batch correction (A1 OAUTHC-recovery sweep)
    "torch>=2.0.0",
    "einops>=0.7.0",  # canonical Wagner transformer

    # Utilities
    "tqdm>=4.65.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-xdist>=3.5.0",  # parallel test execution (`pytest -n <N>`)
    "black>=23.7.0",
    "ruff>=0.1.0",
    "jsonschema>=4.20.0",
]

[project.scripts]
argo = "argo_deepmsi.cli:app"

[project.urls]
Homepage = "https://github.com/mat10d/ARGO-DeepMSI"
Repository = "https://github.com/mat10d/ARGO-DeepMSI"

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
include = ["argo_deepmsi*"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"  # shared HPC: never write to /tmp
markers = [
    "gpu: tests that require a CUDA device",
    "lazyslide: tests that need the LazySlide stack (run in envs/lazyslide; auto-skipped in core)",
    "integration: tests that use staged checkpoints or repository result data",
    "model_download: tests that download model weights from HuggingFace",
    "network: integration tests that download public slide data",
    "requires_hf_token: tests that need $HF_TOKEN set (gated models)",
]
