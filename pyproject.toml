[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argo-deepmsi"
version = "0.1.0"
description = "Multi-model MSI prediction pipeline for whole slide images"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ARGO-DeepMSI Team"},
]
keywords = ["pathology", "deep-learning", "MSI", "whole-slide-imaging", "computational-pathology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "h5py>=3.9.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]
cloud = [
    "boto3>=1.28.0",
    "awscli>=1.29.0",
]

[project.urls]
Homepage = "https://github.com/mat10d/ARGO-DeepMSI"
Repository = "https://github.com/mat10d/ARGO-DeepMSI"
Documentation = "https://github.com/mat10d/ARGO-DeepMSI/tree/overhaul"

[tool.setuptools]
packages = ["argo_deepmsi"]

[tool.setuptools.package-data]
argo_deepmsi = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
