[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argo-deepmsi"
version = "0.2.0"
description = "MSI prediction from whole slide images using LazySlide"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [
    {name = "ARGO-DeepMSI Team"},
]
keywords = ["pathology", "deep-learning", "MSI", "whole-slide-imaging", "computational-pathology", "lazyslide"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "lazyslide[models]>=0.12.0,<0.13.0",
    "lazyslide-models>=0.0.4,<0.1.0",
    "wsidata>=0.10.0,<0.12.0",  # LazySlide 0.12-compatible data layer
    "pandas>=2.0.0,<3.0.0",  # <3.0 to avoid ArrowStringArray serialization issues
    "numpy>=1.24.0",
    "packaging>=23.0",

    # Fix for lazyslide dependency issues with Python 3.11
    "llvmlite>=0.46.0",
    "numba>=0.59.0",

    # Data ingestion
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0,<4.0.0",  # PathPresenter Excel workbook exports
    "xlrd>=2.0.0,<3.0.0",  # Legacy .xls PathPresenter exports

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "umap-learn>=0.5.0",  # slide-embedding UMAP
    "scanpy>=1.10.0",  # tile clustering + AnnData UMAP path

    # Scverse data layer
    "anndata>=0.10.0",
    "zarr>=2.17.0",  # direct X-matrix reads in aggregation

    # ML/Training
    "scikit-learn>=1.3.0",
    "inmoose>=0.9.0",  # pycombat ComBat batch correction (A1 OAUTHC-recovery sweep)
    "torchstain>=1.3.0",  # Macenko stain normalization (A2 OAUTHC image-level correction)
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "einops>=0.7.0",  # Required by gigapath and other vision models
    "einops-exts>=0.0.4",  # Extensions for einops
    "fairscale>=0.4.13",  # Required by MUSK
    "sentencepiece>=0.1.99",  # MUSK uses XLMRobertaTokenizer which requires it
    # Commit-pinned because this repository has no stable package release.
    "musk @ git+https://github.com/lilab-stanford/MUSK@714b666969c1911e5efe70d991140a21030f4ef3",

    # Utilities
    "tqdm>=4.65.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-xdist>=3.5.0",  # parallel test execution (`pytest -n <N>`)
    "black>=23.7.0",
    "ruff>=0.1.0",
    "jsonschema>=4.20.0",
]
# Elastic SLURM extraction via scripts/extract_dask.py
dask = [
    "dask>=2024.1.0",
    "distributed>=2024.1.0",
    "dask-jobqueue>=0.8.0",
]
# Optional model-specific deps. Each LazySlide model that needs extra
# Python packages gets its own extra so you only pay for what you use.
#   pip install -e ".[conch]"     # for mahmoodlab/CONCH
#   pip install -e ".[omiclip]"   # for OmiCLIP
conch = [
    "conch @ git+https://github.com/mahmoodlab/CONCH.git@141cc09c7d4ff33d8eda562bd75169b457f71a62",
]
omiclip = [
    "open_clip_torch>=2.24.0",
]
# Waiv's gated remote model code currently requires the Transformers 5.x API.
# Keep it opt-in so existing encoder environments are not upgraded implicitly.
waiv = [
    "transformers>=5.14.0,<6.0.0",
    "safetensors>=0.8.0",
]

[project.scripts]
argo = "argo_deepmsi.cli:app"

[project.urls]
Homepage = "https://github.com/mat10d/ARGO-DeepMSI"
Repository = "https://github.com/mat10d/ARGO-DeepMSI"

[tool.setuptools.packages.find]
include = ["argo_deepmsi*"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that require a CUDA device",
    "integration: tests that use staged checkpoints or repository result data",
    "model_download: tests that download model weights from HuggingFace",
    "network: integration tests that download public slide data",
    "requires_hf_token: tests that need $HF_TOKEN set (gated models)",
]
