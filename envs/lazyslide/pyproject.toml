[project]
name = "argo-lazyslide-env"
version = "0.1.0"
description = "LazySlide extraction/aggregation environment for ARGO-DeepMSI (core + LazySlide stack)"
requires-python = ">=3.11,<3.12"
dependencies = [
  # ARGO core (CLI, cohort, readers, eval, heads) as an editable path dependency.
  "argo-deepmsi[dev]",

  # LazySlide 0.12 stack
  "lazyslide[models]>=0.12.0,<0.13.0",
  "lazyslide-models>=0.0.4,<0.1.0",
  "wsidata>=0.10.0,<0.12.0",
  "scanpy>=1.10.0",  # tile clustering + AnnData UMAP path
  "torchstain>=1.3.0",  # Macenko stain normalization (A2 OAUTHC image-level correction)
  "setuptools>=61,<81",  # spatialdata -> xarray_schema still imports pkg_resources
  "llvmlite>=0.46.0",
  "numba>=0.59.0",

  # Model-specific dependencies
  "einops>=0.7.0",  # gigapath and other vision models
  "einops-exts>=0.0.4",
  "fairscale>=0.4.13",  # MUSK
  "sentencepiece>=0.1.99",  # MUSK XLMRobertaTokenizer
  # Commit-pinned because this repository has no stable package release.
  "musk @ git+https://github.com/lilab-stanford/MUSK@714b666969c1911e5efe70d991140a21030f4ef3",
  # Waiv's gated remote model code requires the Transformers 5.x API.
  "transformers>=5.14.0,<6.0.0",
  "safetensors>=0.8.0",

  # Elastic SLURM extraction (argo extract-dask)
  "dask>=2024.1.0",
  "distributed>=2024.1.0",
  "dask-jobqueue>=0.8.0",

  # Whitehead GPU driver is CUDA 12.6: PyPI torch 2.14 is a CUDA 13 build and fails at .cuda().
  "torch>=2.0.0",
  "torchvision",
]

[project.optional-dependencies]
conch = [
  "conch @ git+https://github.com/mahmoodlab/CONCH.git@141cc09c7d4ff33d8eda562bd75169b457f71a62",
]
omiclip = [
  "open_clip_torch>=2.24.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
argo-deepmsi = { path = "../..", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
