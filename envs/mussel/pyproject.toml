[project]
name = "argo-mussel-env"
version = "0.1.0"
description = "Isolated Mussel extraction environment for ARGO-DeepMSI (called as a subprocess)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mussel-pathology[torch-gpu] @ git+https://github.com/pathology-data-mining/Mussel@d4cfce9437d92706811b465ff46cfb247c462249",
  "torch<2.6",
  "torchvision",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "torch-gpu" }
torchvision = { index = "torch-gpu" }

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
